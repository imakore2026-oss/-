<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f855a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>家計簿</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button id="prev" aria-label="前の月">‹</button>
  <h1 id="month-label"></h1>
  <button id="next" aria-label="次の月">›</button>
</header>

<section class="summary">
  <div><span>収入</span><b id="sum-income" class="income">0</b></div>
  <div><span>支出</span><b id="sum-expense" class="expense">0</b></div>
  <div><span>収支</span><b id="sum-balance">0</b></div>
</section>

<main>
  <section id="view-list" class="view active">
    <ul id="tx-list" class="tx-list"></ul>
    <p id="list-empty" class="empty">この月の記録はありません</p>
  </section>
  <section id="view-chart" class="view">
    <div class="seg">
      <button data-type="expense" class="on">支出</button>
      <button data-type="income">収入</button>
    </div>
    <div id="chart"></div>
    <ul id="legend" class="legend"></ul>
  </section>
</main>

<nav class="tabs">
  <button data-view="list" class="on">履歴</button>
  <button data-view="chart">グラフ</button>
</nav>
<button id="fab" aria-label="追加">＋</button>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlg-title">記録を追加</h2>
    <div class="seg" id="type-seg">
      <button type="button" data-type="expense" class="on">支出</button>
      <button type="button" data-type="income">収入</button>
    </div>
    <label>日付<input type="date" id="f-date" required></label>
    <label>金額（円）<input type="number" id="f-amount" inputmode="numeric" min="1" step="1" required></label>
    <label>カテゴリ<select id="f-category"></select></label>
    <label>メモ<input type="text" id="f-memo" maxlength="50"></label>
    <div class="actions">
      <button type="button" id="btn-delete" class="danger" hidden>削除</button>
      <button type="button" id="btn-cancel">キャンセル</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>

<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
